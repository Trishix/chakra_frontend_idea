<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>CI Intel - Case Investigation Workspace</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>

  <!-- Tailwind CSS with Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "#f8fafc",
            surface: "#ffffff",
            "surface-subtle": "#f1f5f9",
            "surface-muted": "#e2e8f0",
            primary: "#0f172a",
            "primary-accent": "#1d4ed8",
            "accent-blue": "#2563eb",
            "accent-blue-subtle": "#eff6ff",
            secondary: "#0284c7",
            "border-subtle": "#e2e8f0",
            "border-strong": "#cbd5e1",
            "text-primary": "#0f172a",
            "text-secondary": "#475569",
            "text-muted": "#64748b",

            "status-amber-bg": "#fffbeb",
            "status-red": "#dc2626",
            "status-red-bg": "#fef2f2",

            "status-emerald-bg": "#ecfdf5",

            lg: "0.375rem",
            xl: "0.5rem"

    };

  <style id="ci-intel-professional-polish">
    /* Layout and type polish. The original CI Intel palette remains unchanged. */
    :root {
      --ui-font: "IBM Plex Sans", system-ui, sans-serif;
      --data-font: "JetBrains Mono", ui-monospace, monospace;
      --focus-ring: 0 0 0 3px rgba(37, 99, 235, .22);
    }
    html { font-size: 15px; text-rendering: optimizeLegibility; }
    body { font-family: var(--ui-font); font-size: 13px; line-height: 1.5; letter-spacing: 0; font-synthesis: none; }
    button, input, select, textarea { font-family: inherit; }
    .font-mono { font-family: var(--data-font); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
    /* Role-based hierarchy takes precedence over the reference's tiny utilities.
       Keep the root rem size stable so existing workbench geometry is preserved. */
    #root main h1 { font-size: clamp(21px, 1.7vw, 26px); font-weight: 600; line-height: 1.25; letter-spacing: -.025em; }
    #root main h2 { font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -.012em; }
    #root main h3 { font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; }
    #root main h4 { font-size: 13px; font-weight: 600; line-height: 1.45; letter-spacing: 0; }
    #root main p { font-family: var(--ui-font); font-size: 13px; line-height: 1.65; letter-spacing: 0; }
    #root .font-bold { font-weight: 600; }
    #root .font-mono { letter-spacing: 0; line-height: 1.5; }
    #root .uppercase { letter-spacing: .045em; }
    #root :is(.text-\[9px\], .text-\[9\.5px\], .text-\[10px\], .text-\[10\.5px\]):not(.material-symbols-outlined) { font-size: 11px; line-height: 1.45; }
    #root main :is(button, input, select, textarea) { font-family: var(--ui-font); font-size: 12px; font-weight: 500; line-height: 1.45; letter-spacing: 0; }
    #root main :is(input, textarea).font-mono { font-family: var(--data-font); font-weight: 400; }
    #root main textarea { font-size: 13px; line-height: 1.6; }
    #root nav a { font-size: 12px; font-weight: 500; line-height: 1.5; }
    #root th { font-family: var(--ui-font); font-size: 11px; font-weight: 600; line-height: 1.45; }
    #root td { font-size: 12px; line-height: 1.55; }
    #root main button { white-space: normal; }
    /* Status is text; filled surfaces are reserved for controls. */
    #root .status-text { display: inline-flex; align-items: baseline; gap: 5px; padding: 0; border: 0; border-radius: 0; background: transparent; font-family: var(--ui-font); font-size: 11px; font-weight: 500; line-height: 1.5; letter-spacing: 0; text-transform: none; white-space: nowrap; }
    #root .nav-total { min-width: 20px; margin-left: 8px; text-align: right; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; color: #64748b; }
    #root .nav-total[data-severity="red"] { color: #b91c1c; }
    #root .nav-total[data-severity="amber"] { color: #92400e; }
    #root a[aria-current="page"] .nav-total { color: #e2e8f0; }
    #root .status-text strong { font-weight: 600; font-variant-numeric: tabular-nums; }
    .lead-metadata + .lead-metadata { border-left: 1px solid #cbd5e1; padding-left: 8px; margin-left: 2px; }
    .original-network { touch-action: none; cursor: grab; }
    .original-network:active { cursor: grabbing; }
    .original-network [data-graph-item] { cursor: pointer; }
    .original-network [data-graph-item]:focus-visible { outline: none; box-shadow: none; }
    .original-network [data-graph-item]:focus-visible .selection-ring,
    .original-network [data-graph-item]:hover .selection-ring { stroke: #1d4ed8; }
    .original-network .original-edge:focus-visible rect { stroke: #1d4ed8; stroke-width: 2px; }
    .original-inspector { min-width: 0; max-height: 760px; overflow-y: auto; }
    .original-inspector dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .completed-graph button:disabled { opacity: .45; cursor: not-allowed; }
    .completed-graph .graph-find-bar input { max-width: 100%; min-width: 0; }
    @media (max-width: 1279px) { .original-inspector { max-height: none; border-left: 0; border-top: 1px solid #e2e8f0; } }
    @media (max-width: 767px) {
      #root > div > aside.fixed { position: relative; top: 48px; width: 100%; height: auto; padding-top: 0; border-right: 0; border-bottom: 1px solid #e2e8f0; }
      #root > div > aside.fixed > div:last-child, #root > div > aside.fixed > div:first-child > div { display: none; }
      #root > div > aside.fixed nav { flex-direction: row; overflow-x: auto; flex: none; gap: 4px; }
      #root > div > aside.fixed nav a { flex-shrink: 0; gap: 8px; }
      #root > div > .pl-56 { padding-left: 0; }
      .completed-graph .graph-find-bar label { flex-wrap: wrap; }
      .completed-graph .graph-find-bar input { width: 100%; }
      .completed-graph .graph-layout { min-height: 0; }
      .completed-graph .graph-canvas { min-height: 480px; }
      .completed-graph .graph-stage { height: 360px; }
      .completed-graph .graph-caption { flex-wrap: wrap; gap: 8px; }
    }
    button, a, input, select, textarea { transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease; }
    button:active:not(:disabled), a:active { transform: translateY(1px); }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); }
    ::selection { background: #dbeafe; color: #0f172a; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }

    .app-main { min-width: 0; }
    .page-shell, main { min-width: 0; }
    .section-heading { letter-spacing: -.01em; }
    .surface-card, [class*="border-border-subtle"] { border-color: #dbe3ec; }
    [class*="shadow-sm"], [class*="shadow-xs"], [class*="shadow-2xs"], [class*="shadow-lg"] { box-shadow: 0 1px 3px rgba(15, 23, 42, .08); }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 450, "GRAD" 0, "opsz" 20; }

    /* Improve the shared chrome without changing its theme. */
    aside.fixed { width: 14rem; }
    aside.fixed nav a { min-height: 34px; }
    aside.fixed nav a span:last-child { font-variant-numeric: tabular-nums; }
    header.fixed { min-height: 48px; }
    header.fixed input { height: 29px; line-height: 1; }
    header.fixed button { min-height: 30px; }

    /* Consistent control geometry across all seven workspaces. */
    button[class*="rounded-sm"], a[class*="rounded-sm"], input[class*="rounded-sm"], select[class*="rounded-sm"] { border-radius: 3px; }
    button[class*="px-2"], button[class*="px-2.5"], button[class*="px-3"] { min-height: 30px; }
    textarea { line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: #94a3b8; opacity: 1; }

    /* Tables and dense evidence rows need breathing room and stable numerals. */
    table { font-variant-numeric: tabular-nums; }
    th { letter-spacing: .04em; }
    tr { transition: background-color .16s ease; }
    tr:hover td { background: rgba(239, 246, 255, .55); }
    [class*="hover:bg-slate-50"]:hover { background-color: #f8fafc; }

    /* Keep action feedback inside the product instead of browser alert chrome. */
    .ci-action-toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      width: min(440px, calc(100vw - 32px));
      padding: 11px 14px;
      border: 1px solid #334155;
      border-radius: 4px;
      background: #0f172a;
      color: #f8fafc;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .18);
      font: 500 12px/1.45 var(--ui-font);
      transform: translate(-50%, 10px);
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }
    .ci-action-toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1023px) {
      aside.fixed { width: 13rem; }
      header.fixed { padding-left: 13.75rem; }
      .max-w-\[1640px\] { max-width: none; }
    }
    @media (max-width: 767px) {
      aside.fixed { width: min(18rem, 88vw); }
      header.fixed { padding-left: .75rem; padding-right: .75rem; }
      header.fixed > div:first-child { min-width: 0; }
      header.fixed > div:first-child > div:last-child { display: none; }
      header.fixed input { width: 8rem; }
      .ci-action-toast { bottom: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>

  <!-- React 18 and Router 6 dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-canvas font-sans text-text-primary antialiased selection:bg-blue-100 selection:text-primary-accent">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // --- Shared Sidebar Component ---
    function NavigationRail() {
      const location = useLocation();
      const currentPath = location.pathname;

      const navItems = [
        { path: "/", label: "Case overview", icon: "dashboard", count: "14", isAlert: false },
        { path: "/network-graph", label: "Case connections", icon: "hub", count: String(graphNodes.length), isAlert: false, badgeClass: "bg-blue-50 text-accent-blue font-medium" },
        { path: "/evidence-chain", label: "Evidence timeline", icon: "fact_check", count: "102", isAlert: false },
        { path: "/surveillance-ai", label: "Camera search", icon: "videocam", count: "3 ALERTS", isAlert: true, alertType: "red" },
        { path: "/event-matrix", label: "Event timeline", icon: "timeline", count: "89", isAlert: false },
        { path: "/ai-lead-queue", label: "Review leads", icon: "approval_delegation", count: "7 PEND", isAlert: true, alertType: "amber" },
        { path: "/custody-audit", label: "Evidence history", icon: "policy", count: "SYNC", isAlert: false, badgeClass: "font-medium" }
      ];

      return (
        <aside className="fixed left-0 top-0 h-full w-56 bg-surface border-r border-border-subtle z-40 flex flex-col justify-between pt-12 shadow-sm">
          <div className="flex flex-col flex-1 overflow-y-auto">
            <div className="px-3 py-2 border-b border-border-subtle flex items-center justify-between bg-surface-subtle/50">
              <span className="text-[11px] font-semibold text-text-muted uppercase tracking-wider">Cases</span>
              <span className="font-mono text-[10px] px-1.5 py-0.5 rounded-sm bg-surface border border-border-subtle text-primary font-semibold">NZ-04</span>
            </div>
            <nav className="flex flex-col gap-0.5 p-2 flex-1">
              {navItems.map((item) => {
                const isActive = (item.path === "/" && currentPath === "/") || (item.path !== "/" && currentPath.startsWith(item.path));
                return (
                  <Link
                    key={item.path}
                    to={item.path}
                    aria-current={isActive ? "page" : undefined}
                    className={`flex items-center justify-between px-2.5 py-1.5 rounded-sm text-[12px] transition-colors ${
                      isActive
                        ? "bg-primary text-white font-medium shadow-sm"
                        : "text-text-secondary hover:bg-surface-subtle hover:text-text-primary"
                    }`}
                  >
                    <span className="flex items-center gap-2">
                      <span className={`material-symbols-outlined text-[17px] ${isActive ? "text-white" : "text-text-muted"}`}>
                        {item.icon}
                      </span>
                      {item.label}
                    </span>
                    <span className="nav-total" data-severity={item.alertType}
                      aria-label={item.isAlert ? item.count.replace("ALERTS", "alerts").replace("PEND", "pending") : undefined}
                      title={item.isAlert ? item.count.replace("ALERTS", "alerts").replace("PEND", "pending") : undefined}>
                      {item.isAlert ? item.count.split(" ")[0] : item.count === "SYNC" ? "Synced" : item.count}
                    </span>
                  </Link>
                );
              })}
            </nav>
          </div>
          <div className="p-2 border-t border-border-subtle bg-surface-subtle/30">
            <div className="flex items-center gap-2 p-1.5 rounded-sm bg-surface border border-border-subtle">
              <span className="material-symbols-outlined text-primary-accent text-[17px]">verified_user</span>
              <div className="flex flex-col">
                <span className="font-mono text-[10px] text-text-primary font-semibold leading-none">Ledger status</span>
                <span className="font-mono text-[9px] text-text-muted leading-tight mt-0.5">Block #88921 • Signed</span>
              </div>
            </div>
          </div>
        </aside>
      );
    }

            {/* MAIN WRAPPER */}

    const graphKinds = ["Person","Phone","Account","Vehicle","Case","Camera"];
    const graphById = Object.fromEntries(graphNodes.map(n => [n.id,n]));
    function graphSlice(hops, direct, inferred, kinds) {
      const candidates = graphEdges.filter(e => (e.inferred ? inferred : direct) &&
        kinds.includes(graphById[e.source].kind) && kinds.includes(graphById[e.target].kind));
      const distance = {tariq:0};
      for (let step=0; step<hops; step++) {
        candidates.forEach(e => {
          if (distance[e.source] === step && distance[e.target] === undefined) distance[e.target] = step+1;
          if (distance[e.target] === step && distance[e.source] === undefined) distance[e.source] = step+1;
        });
      }
      const nodes = graphNodes.filter(n => distance[n.id] !== undefined && kinds.includes(n.kind));
      const ids = new Set(nodes.map(n => n.id));
      return {nodes, edges:candidates.filter(e => ids.has(e.source) && ids.has(e.target))};
    }

      const source=slice.edges.find(e=>e.id===sourceId);

    let actionToastTimer;
    window.alert = (message) => {
      let toast = document.querySelector('.ci-action-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'ci-action-toast';
        toast.setAttribute('role', 'status');
        document.body.appendChild(toast);
      }
      toast.textContent = String(message).replace(/^Action Blocked:\s*/i, 'Review blocked. ');
      requestAnimationFrame(() => toast.classList.add('is-visible'));
      clearTimeout(actionToastTimer);
      actionToastTimer = setTimeout(() => toast.classList.remove('is-visible'), 4200);
    };
